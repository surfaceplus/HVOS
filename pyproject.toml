[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hvos"
version = "10.2.0"
description = "HVOS — Hermes Venture Operating System: AI DTC Venture Studio"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "sqlite3",  # stdlib
    "paramiko>=3.0",
    "requests>=2.28",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]
full = [
    "pytrends",
    "praw",
    "beautifulsoup4",
    "pymysql",
    "firecrawl",
]

[project.scripts]
hvos = "hvos_cli:main"

[tool.setuptools.packages.find]
include = ["hvos*", "core*", "governance*", "learning*", "reasoning*", 
           "knowledge_graph*", "memory*", "opportunity*", "reality*", 
           "hvos_api*", "scripts*", "sourcing*"]
