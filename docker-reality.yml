# HVOS Reality Layer — Docker Compose
# ====================================
# 启动：docker compose -f docker-reality.yml up -d
# 停止：docker compose -f docker-reality.yml down
# 日志：docker compose -f docker-reality.yml logs -f

services:

  # ──────────────────────────────────────────────────────────
  # PostgreSQL — 持久化关系数据
  # ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: hvos-postgres
    environment:
      POSTGRES_DB: hvos
      POSTGRES_USER: hvos
      POSTGRES_PASSWORD: hvos_secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hvos"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hvos-net

  # ──────────────────────────────────────────────────────────
  # Redis — 事件总线缓存 / KV Store
  # ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hvos-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hvos-net

  # ──────────────────────────────────────────────────────────
  # Neo4j — Knowledge Graph 图数据库
  # ──────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.18-community
    container_name: hvos-neo4j
    environment:
      NEO4J_AUTH: neo4j/hvos_password
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 2g
      NEO4J_dbms_memory_page__cache_size: 1g
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    networks:
      - hvos-net

  # ──────────────────────────────────────────────────────────
  # MinIO — S3 兼容对象存储（备份/报告）
  # ──────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: hvos-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hvos
      MINIO_ROOT_PASSWORD: hvos_minio_password
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hvos-net

  # ──────────────────────────────────────────────────────────
  # hvOS Core — 主应用（Reality Layer + KG +调度）
  # ──────────────────────────────────────────────────────────
  hvos-core:
    build:
      context: .
      dockerfile: Dockerfile.hvos
    container_name: hvos-core
    environment:
      # 数据库
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: hvos
      POSTGRES_USER: hvos
      POSTGRES_PASSWORD: hvos_secure_password
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Neo4j
      NEO4J_HOST: neo4j
      NEO4J_BOLT_PORT: 7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: hvos_password
      # MinIO
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: hvos
      MINIO_SECRET_KEY: hvos_minio_password
      # Reality Layer
      REALITY_CONFIG: /app/reality_config.json
      # Hermès
      HERMES_CONFIG: /app/hermes_config.yaml
    volumes:
      - ./reality_config.json:/app/reality_config.json:ro
      - ./reality:/app/reality:ro
      - hvos_logs:/app/logs
    ports:
      - "8000:8000"  # API
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_started
    networks:
      - hvos-net
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────
  # Traefik — 反向代理 + Let's Encrypt
  # ──────────────────────────────────────────────────────────
  traefik:
    image: traefik:v3.0
    container_name: hvos-traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.network=hvos-net"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=admin@hiugift.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Traefik Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
    networks:
      - hvos-net
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  minio_data:
  hvos_logs:
  traefik_certs:

networks:
  hvos-net:
    driver: bridge